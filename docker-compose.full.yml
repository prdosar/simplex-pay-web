services:
  postgres:
    image: postgres:16-alpine
    container_name: simplexpay-postgres
    environment:
      POSTGRES_DB: simplexpay
      POSTGRES_USER: simplexpay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplexpay"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: SimplexPay.API/Dockerfile
    container_name: simplexpay-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=simplexpay;Username=simplexpay;Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_SECRET_KEY}
      - Jwt__Issuer=simplexpay-api
      - Jwt__Audience=simplexpay-clients
      - Jwt__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-60}
      - Jwt__RefreshExpiryDays=${JWT_REFRESH_EXPIRY_DAYS:-30}
      - Cors__Origins__0=${WEB_URL}
      - Cors__Origins__1=${ADMIN_URL}
      - Cors__AdminOrigins__0=${ADMIN_URL}
      - Smtp__Host=${SMTP_HOST}
      - Smtp__Port=${SMTP_PORT:-465}
      - Smtp__User=${SMTP_USER}
      - Smtp__Pass=${SMTP_PASS}
      - Smtp__From=${SMTP_FROM}
      - App__Url=${WEB_URL}
      - App__EmailVerificationCodeExpiryMinutes=${EMAIL_VERIFICATION_EXPIRY_MINUTES:-15}
      - App__EmailVerificationMaxAttempts=${EMAIL_VERIFICATION_MAX_ATTEMPTS:-5}
    ports:
      - "${API_PORT:-5041}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # URL de l'API telle que le NAVIGATEUR la voit (domaine public HTTPS).
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL}
    container_name: simplexpay-web
    ports:
      - "${WEB_PORT:-3003}:3000"
    depends_on:
      - api
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL}
    container_name: simplexpay-admin
    ports:
      - "${ADMIN_PORT:-3004}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
