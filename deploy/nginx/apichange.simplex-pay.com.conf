# /etc/nginx/sites-available/apichange.simplex-pay.com
# Symlink : ln -s /etc/nginx/sites-available/apichange.simplex-pay.com /etc/nginx/sites-enabled/
# HTTPS : certbot --nginx -d apichange.simplex-pay.com

server {
    listen 80;
    listen [::]:80;
    server_name apichange.simplex-pay.com;

    # Uploads (photos de profil, pièces jointes offres) — ajuster si besoin
    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:5041;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    # WebSocket upgrade pour SignalR (/hubs/*)
    location /hubs/ {
        proxy_pass         http://127.0.0.1:5041;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # WebSocket = connexion longue
        proxy_send_timeout 3600s;
    }
}
