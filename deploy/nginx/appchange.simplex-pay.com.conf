# /etc/nginx/sites-available/appchange.simplex-pay.com
# Symlink : ln -s /etc/nginx/sites-available/appchange.simplex-pay.com /etc/nginx/sites-enabled/
# HTTPS : certbot --nginx -d appchange.simplex-pay.com

server {
    listen 80;
    listen [::]:80;
    server_name appchange.simplex-pay.com;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }
}
