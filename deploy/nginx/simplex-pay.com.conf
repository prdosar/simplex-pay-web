# /etc/nginx/sites-available/simplex-pay.com
# Symlink : ln -s /etc/nginx/sites-available/simplex-pay.com /etc/nginx/sites-enabled/
# HTTPS ajouté automatiquement par : certbot --nginx -d simplex-pay.com -d www.simplex-pay.com

server {
    listen 80;
    listen [::]:80;
    server_name simplex-pay.com www.simplex-pay.com;

    # Redirection www → apex (optionnel — commenter si tu veux garder www)
    if ($host = www.simplex-pay.com) {
        return 301 https://simplex-pay.com$request_uri;
    }

    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }
}
